<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI小程序合集</title>
<style>
  :root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --accent:#6366f1;
    --accent2:#06b6d4;
    --card:rgba(255,255,255,.06);
    --card-hover:rgba(255,255,255,.12);
    --text:#f1f5f9;
    --muted:#94a3b8;
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(99,102,241,.35), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(6,182,212,.28), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100%;
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(18px,5vw,40px) 56px;
  }
  /* ===== Hero ===== */
  .hero{text-align:center;margin-bottom:clamp(30px,5vw,52px);}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px;margin-bottom:22px;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);}
  h1{
    font-size:clamp(34px,8vw,60px);
    line-height:1.1;font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,#a5b4fc,#67e8f9,#a5b4fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    margin-top:12px;font-size:clamp(13px,3.2vw,15px);color:var(--muted);
  }
  .sub b{color:#cbd5e1;font-weight:600;}
  /* ===== Grid ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:clamp(16px,2.5vw,24px);
  }
  .card{
    position:relative;overflow:hidden;
    background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:26px 24px 24px;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;
    min-height:200px;
    transition:transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
    backdrop-filter:blur(8px);
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-6px);
    background:var(--card-hover);
    border-color:rgba(99,102,241,.55);
    box-shadow:0 18px 40px -18px rgba(99,102,241,.6);
    outline:none;
  }
  .card .num{
    font-size:13px;font-weight:700;color:var(--accent2);
    letter-spacing:2px;opacity:.9;
  }
  .ico{
    width:58px;height:58px;border-radius:16px;margin:14px 0 16px;
    display:grid;place-items:center;font-size:30px;
    background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(6,182,212,.25));
    border:1px solid var(--line);
  }
  .card h3{font-size:20px;font-weight:700;margin-bottom:8px;}
  .card p{font-size:14px;color:var(--muted);line-height:1.6;flex:1;}
  .go{
    margin-top:18px;display:inline-flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;color:#c7d2fe;
  }
  .go .arrow{transition:transform .25s ease;}
  .card:hover .go .arrow{transform:translateX(5px);}
  /* placeholder card */
  .card.disabled{
    cursor:default;opacity:.85;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 14px,rgba(255,255,255,.07) 14px,rgba(255,255,255,.07) 28px);
  }
  .card.disabled:hover{
    transform:none;box-shadow:none;border-color:var(--line);background:repeating-linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 14px,rgba(255,255,255,.07) 14px,rgba(255,255,255,.07) 28px);
  }
  .card.disabled .ico{filter:grayscale(.6);opacity:.7;}
  .card.disabled h3{color:#cbd5e1;}
  .soon{
    margin-top:18px;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--muted);
    border:1px dashed var(--line);padding:6px 12px;border-radius:999px;
  }
  footer{
    text-align:center;margin-top:clamp(40px,6vw,64px);
    font-size:13px;color:var(--muted);
  }
  footer a{color:#818cf8;text-decoration:none;}
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <span class="badge"><span class="dot"></span> 小程序合集 · Mini Programs</span>
      <h1>AI小程序合集</h1>
      <p class="sub">by <b>梁英俊</b></p>
    </header>

    <section class="grid">
      <a class="card" href="https://peterinblue.github.io/demo/01/" target="_blank" rel="noopener">
        <span class="num">01</span>
        <div class="ico">📷</div>
        <h3>证件照制作</h3>
        <p>一键上传，自动裁剪生成各类标准尺寸证件照，无需跑照相馆。</p>
        <span class="go">进入小程序 <span class="arrow">→</span></span>
      </a>

      <a class="card" href="https://peterinblue.github.io/demo/02/" target="_blank" rel="noopener">
        <span class="num">02</span>
        <div class="ico">🚇</div>
        <h3>上海地铁票价测算器</h3>
        <p>输入起点与终点，秒算地铁票价与里程，通勤出行好帮手。</p>
        <span class="go">进入小程序 <span class="arrow">→</span></span>
      </a>

      <a class="card" href="https://peterinblue.github.io/demo/03/" target="_blank" rel="noopener">
        <span class="num">03</span>
        <div class="ico">🌐</div>
        <h3>数智能源管理平台3D版</h3>
        <p>园区能碳可视化大屏，3D 场景实时呈现能耗、光伏与设备状态。</p>
        <span class="go">进入小程序 <span class="arrow">→</span></span>
      </a>

      <div class="card disabled" aria-disabled="true">
        <span class="num">04</span>
        <div class="ico">⏳</div>
        <h3>更多小程序开发中…</h3>
        <p>新作品正在打磨中，敬请期待下一批上线的小工具。</p>
        <span class="soon">敬请期待</span>
      </div>
    </section>

    <footer>
      © 2026 AI小程序合集 · by 梁英俊
    </footer>
  </main>
</body>
</html>
