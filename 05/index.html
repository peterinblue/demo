<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>认识梁英俊 — 个人简介</title>

<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {

    background: #eef0f3;

    display: flex; flex-direction: column; align-items: center;

    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

    padding: 24px 12px;

    min-height: 100vh;

  }

  .wrap {

    width: min(94vw, 980px);

    margin: auto 0;               /* 内容不超高时垂直居中；超高时归零，不裁顶部 */

    display: flex; flex-direction: column;

    gap: clamp(10px, 1.4vw, 16px);

  }

  .card {

    position: relative;

    width: 100%;

    aspect-ratio: 3 / 2;

    border: 6px solid #14161a;

    border-radius: 28px;

    overflow: hidden;

    background: #f2f2f4;

    box-shadow: 0 18px 45px rgba(17, 24, 39, .18);

    transition: transform .25s ease, box-shadow .25s ease;

  }

  .card:hover { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(17, 24, 39, .22); }

  .card > img.person {

    position: absolute; inset: 0;

    width: 100%; height: 100%;

    object-fit: cover; object-position: left center;

  }

  .content {

    position: absolute;

    left: 55.0%; right: 4%; top: 50%;

    transform: translateY(-50%);

    display: flex; flex-direction: column; gap: clamp(12px, 2.4cqw, 22px);

  }

  .burst { width: 92%; filter: drop-shadow(0 6px 14px rgba(26,116,240,.35)); }

  .burst svg { width: 100%; height: auto; display: block; overflow: visible; transform: rotate(-2deg); }

  .points { list-style: none; display: flex; flex-direction: column; gap: clamp(8px, 1.9cqw, 18px); }

  .points li {

    position: relative;

    padding-left: clamp(20px, 4cqw, 36px);

    font-weight: 800;

    color: #111318;

    font-size: clamp(11px, 3cqw, 26px);

    line-height: 1.35;

    white-space: nowrap;

  }

  .points li::before {

    content: "";

    position: absolute; left: 0; top: .52em;

    width: clamp(7px, 1.5cqw, 12px); height: clamp(7px, 1.5cqw, 12px);

    border-radius: 50%; background: #111318;

  }



  /* ---- 底部联系方式条（沿用卡片同一套描边/底色/圆角语言） ---- */

  .contact {

    display: flex; align-items: center; justify-content: space-between;

    gap: clamp(14px, 2.4vw, 30px);

    padding: clamp(12px, 1.5vw, 18px) clamp(16px, 2.2vw, 26px);

    border: 6px solid #14161a;

    border-radius: 24px;

    background: #f2f2f4;

    box-shadow: 0 14px 34px rgba(17, 24, 39, .13);

  }

  .mail-group { display: flex; align-items: center; gap: clamp(10px, 1.4vw, 16px); min-width: 0; }

  .badge {

    flex: 0 0 auto;

    width: clamp(38px, 4.4vw, 52px); height: clamp(38px, 4.4vw, 52px);

    border-radius: 15px;

    background: #1a74f0;

    display: flex; align-items: center; justify-content: center;

    box-shadow: 0 6px 14px rgba(26, 116, 240, .38);

  }

  .badge svg { width: 54%; height: 54%; display: block; }

  .meta { min-width: 0; }

  .meta .k {

    display: block; margin-bottom: .4em;

    font-size: clamp(9.5px, 1.05vw, 12px);

    font-weight: 700; letter-spacing: .16em;

    color: #6b7280; text-transform: uppercase;

  }

  .meta .k.green { color: #07a64a; }

  .meta .v {

    display: block;

    font-size: clamp(15px, 1.95vw, 24px);

    font-weight: 900; letter-spacing: .01em;

    color: #111318; text-decoration: none;

    white-space: nowrap;

    transition: color .2s ease;

  }

  a.v:hover { color: #1a74f0; }

  .qr-group { display: flex; align-items: center; gap: clamp(10px, 1.4vw, 16px); flex: 0 0 auto; }

  .qr-txt { text-align: right; }

  .qr {

    flex: 0 0 auto;

    width: clamp(76px, 9.6vw, 112px); height: auto;

    background: #fff; padding: 6px;

    border: 3px solid #14161a; border-radius: 14px;

    box-shadow: 0 6px 16px rgba(17, 24, 39, .10);

  }

  @media (max-width: 560px) {

    body { padding: 18px 12px 26px; }

    .card { aspect-ratio: auto; }

    .card > img.person {

      position: relative; display: block;

      width: 100%; height: auto; object-fit: contain;

    }

    .content { position: static; transform: none; padding: 18px 20px 26px; }

    .points li { white-space: normal; }

    .contact { flex-direction: column; align-items: stretch; gap: 14px; border-radius: 20px; }

    .qr-group { justify-content: space-between; }

    .qr-txt { text-align: left; }

  }

</style>

</head>
