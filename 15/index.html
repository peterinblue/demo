<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>飞机穿环小游戏 by 梁英俊</title>
<style>
  :root{
    --ink:#f2f5ff;
    --ink-2:#a8b4d8;
    --ink-3:#7b88ad;
    --line:rgba(255,255,255,.12);
    --glass:rgba(16,22,54,.52);
    --brand:#ffb648;
    --cyan:#5ee7ff;
    --rose:#ff6b8a;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#070a1e 0%,#0d1233 55%,#181040 100%);
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }

  /* ---------- 顶部品牌条：logo + 标题 ---------- */
  header{
    flex:0 0 auto;
    padding:calc(10px + var(--safe-t)) 14px 8px;
    text-align:center;
    position:relative;z-index:6;
  }
  .brand{
    display:inline-flex;align-items:center;justify-content:center;
    gap:clamp(8px,2.2vw,14px);
  }
  .brand img{
    width:clamp(30px,7.2vw,48px);
    height:clamp(30px,7.2vw,48px);
    object-fit:contain;
    filter:drop-shadow(0 3px 9px rgba(224,72,72,.42)) drop-shadow(0 0 16px rgba(190,40,40,.26));
    transform:rotate(-3deg);
    flex:0 0 auto;
  }
  .brand .txt{text-align:left;line-height:1.14;}
  .brand h1{
    margin:0;
    font-size:clamp(16px,4.1vw,27px);
    font-weight:800;
    letter-spacing:.6px;
    white-space:nowrap;
    background:linear-gradient(94deg,#ffd9a0 0%,#ffb648 30%,#ff7ba8 62%,#8ad8ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    text-shadow:0 2px 18px rgba(255,150,90,.18);
  }
  .brand h1 .by{
    -webkit-text-fill-color:#a9b6da;color:#a9b6da;
    font-size:.6em;font-weight:700;letter-spacing:1.6px;
    margin-left:.45em;
    white-space:nowrap;
  }
  @media (max-width:430px){
    .brand h1 .by{display:block;margin-left:0;font-size:.74em;letter-spacing:2px;margin-top:1px;}
    .brand .txt{text-align:left;}
  }

  /* ---------- 舞台 ---------- */
  .stage{
    flex:1 1 auto;position:relative;min-height:0;
    width:100%;
  }
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  .hud{position:absolute;inset:0;pointer-events:none;z-index:4;
       padding:calc(8px + var(--safe-t)) 12px 10px;
       display:flex;flex-direction:column;justify-content:space-between;}
  .hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}

  .card{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:13px;
    padding:8px 13px;
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    box-shadow:0 6px 22px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .lbl{font-size:10.5px;letter-spacing:2.4px;color:var(--ink-3);text-transform:uppercase;}
  .val{font-size:clamp(19px,5.2vw,27px);font-weight:800;letter-spacing:.5px;
       font-variant-numeric:tabular-nums;line-height:1.16;}
  .val.gold{color:var(--brand);text-shadow:0 0 16px rgba(255,182,72,.45);}
  .val small{font-size:.52em;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:.5px;}

  .hearts{display:flex;gap:5px;justify-content:flex-end;margin-top:5px;}
  .hearts i{
    width:clamp(13px,3.4vw,17px);height:clamp(13px,3.4vw,17px);display:block;
    background:linear-gradient(160deg,#ff8fa6,#ff3f66);
    clip-path:path('M8 15.2C3.4 11.3.6 8.4.6 5.4.6 3 2.4 1.2 4.7 1.2c1.6 0 2.9.9 3.3 2 .4-1.1 1.7-2 3.3-2 2.3 0 4.1 1.8 4.1 4.2 0 3-2.8 5.9-7.4 9.8z');
    filter:drop-shadow(0 0 6px rgba(255,80,110,.6));
    transition:transform .22s, opacity .22s, filter .22s;
  }
  .hearts i.off{background:linear-gradient(160deg,#5a6280,#39405c);opacity:.42;filter:none;transform:scale(.82);}

  .combo{
    align-self:center;
    font-size:clamp(12px,3.1vw,15px);font-weight:800;letter-spacing:1px;
    color:#fff;background:linear-gradient(100deg,rgba(255,122,168,.9),rgba(140,110,255,.9));
    border-radius:999px;padding:4px 14px;
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 4px 18px rgba(200,90,220,.35);
    opacity:0;transform:translateY(-6px) scale(.9);
    transition:opacity .2s, transform .2s;
  }
  .combo.on{opacity:1;transform:translateY(0) scale(1);}

  /* 中央提示（完美 / 撞击等） */
  .pop{
    position:absolute;left:50%;top:38%;
    transform:translate(-50%,-50%);
    font-size:clamp(20px,6.4vw,40px);font-weight:900;letter-spacing:2px;
    pointer-events:none;opacity:0;z-index:5;
    text-shadow:0 3px 20px rgba(0,0,0,.5);
    white-space:nowrap;
  }
  .pop.go{animation:popUp .85s ease-out forwards;}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    22%{opacity:1;transform:translate(-50%,-56%) scale(1.08);}
    70%{opacity:1;transform:translate(-50%,-76%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-92%) scale(.96);}
  }

  /* ---------- 覆盖层 ---------- */
  .veil{
    position:absolute;inset:0;z-index:8;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    background:radial-gradient(circle at 50% 42%,rgba(10,14,40,.34),rgba(5,7,22,.82));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .veil[hidden]{display:none;}
  .panel{
    width:min(430px,94vw);
    max-height:100%;
    overflow:auto;
    background:linear-gradient(170deg,rgba(28,34,78,.9),rgba(14,18,48,.94));
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:22px 22px 20px;
    text-align:center;
    box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .panel h2{
    margin:0 0 4px;font-size:clamp(21px,6vw,32px);font-weight:900;letter-spacing:1px;
    background:linear-gradient(96deg,#ffd9a0,#ff9ec4 55%,#8ad8ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .panel .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);letter-spacing:1.2px;line-height:1.7;}
  .keys{
    display:grid;grid-template-columns:repeat(2,1fr);gap:7px;
    margin:0 0 15px;text-align:left;
  }
  .keys div{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    border-radius:10px;padding:7px 9px;font-size:12px;color:var(--ink-2);
    display:flex;align-items:center;gap:7px;
  }
  .keys kbd{
    font-family:inherit;font-size:10.5px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
    border-bottom-width:2px;border-radius:5px;padding:2px 6px;flex:0 0 auto;
  }
  .btn{
    pointer-events:auto;cursor:pointer;
    display:inline-block;border:0;
    font-family:inherit;font-size:clamp(15px,4.2vw,18px);font-weight:800;letter-spacing:2px;
    color:#3a1a00;
    background:linear-gradient(100deg,#ffd07a,#ff9d5c 52%,#ff7ba8);
    padding:12px 34px;border-radius:999px;
    box-shadow:0 8px 26px rgba(255,140,90,.36), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .16s, box-shadow .16s, filter .16s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 12px 32px rgba(255,140,90,.46);}
  .btn:active{transform:translateY(1px) scale(.98);}
  .btn.ghost{
    background:rgba(255,255,255,.08);color:var(--ink);
    box-shadow:none;border:1px solid rgba(255,255,255,.16);
    font-size:13px;padding:9px 22px;letter-spacing:1.4px;
  }
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;}

  .score-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px;
  }
  .score-grid div{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;padding:9px 4px;
  }
  .score-grid b{display:block;font-size:clamp(15px,4.4vw,20px);font-weight:800;font-variant-numeric:tabular-nums;}
  .score-grid span{font-size:10px;color:var(--ink-3);letter-spacing:1.4px;}

  .rank{
    display:inline-flex;align-items:center;justify-content:center;
    width:64px;height:64px;border-radius:50%;
    font-size:32px;font-weight:900;color:#2b1200;
    background:conic-gradient(from 210deg,#ffe6a8,#ffb648 40%,#ff7ba8 78%,#ffe6a8);
    box-shadow:0 0 30px rgba(255,170,90,.5), inset 0 2px 6px rgba(255,255,255,.6);
    margin-bottom:8px;
  }

  /* ---------- 底部提示 ---------- */
  footer{
    flex:0 0 auto;z-index:6;
    padding:6px 14px calc(8px + var(--safe-b));
    text-align:center;
    font-size:11.5px;letter-spacing:.8px;color:var(--ink-3);
    background:linear-gradient(0deg,rgba(6,8,26,.85),rgba(6,8,26,0));
  }
  footer b{color:var(--ink-2);font-weight:700;}
  footer kbd{
    font-family:inherit;font-size:10px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;margin:0 1px;
  }
  .topbtn{
    position:absolute;z-index:7;
    width:34px;height:34px;border-radius:11px;
    background:var(--glass);border:1px solid var(--line);
    color:var(--ink-2);font-size:14px;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    cursor:pointer;pointer-events:auto;
  }
  #btnSound{right:12px;bottom:calc(46px + var(--safe-b));}
  #btnPause{left:12px;bottom:calc(46px + var(--safe-b));}
</style>
</head>

  <div class="veil" id="veilOver" hidden>
    <div class="panel">
      <div class="rank" id="uiRank">S</div>
      <h2 id="uiOverTitle">任务完成</h2>
      <p class="sub" id="uiOverSub">航迹已记录</p>
      <div class="score-grid">
        <div><b id="uiFScore" style="color:var(--brand)">0</b><span>总得分</span></div>
        <div><b id="uiFRings">0</b><span>穿环数</span></div>
        <div><b id="uiFPerfect">0</b><span>完美穿环</span></div>
        <div><b id="uiFCombo">0</b><span>最高连击</span></div>
        <div><b id="uiFDist">0</b><span>航程 m</span></div>
        <div><b id="uiFBest">0</b><span>历史最佳</span></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="btnRetry">再来一局</button>
      </div>
    </div>
  </div>
</div>

<footer id="footHint">
  <b>拖动屏幕</b> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 操纵飞机 · 穿过金色光环得分
</footer>

<script>
(function(){
'use strict';

/* ================= 基础工具 ================= */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ================= DOM ================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha:false });
var stage = document.getElementById('stage');
var $ = function(id){ return document.getElementById(id); };
var ui = {
  score:$('uiScore'), best:$('uiBest'), best2:$('uiBest2'), combo:$('uiCombo'),
  pop:$('uiPop'), hearts:$('uiHearts'), foot:$('footHint'),
  vStart:$('veilStart'), vPause:$('veilPause'), vOver:$('veilOver'),
  rank:$('uiRank'), overTitle:$('uiOverTitle'), overSub:$('uiOverSub'),
  fScore:$('uiFScore'), fRings:$('uiFRings'), fPerfect:$('uiFPerfect'),
  fCombo:$('uiFCombo'), fDist:$('uiFDist'), fBest:$('uiFBest'),
  btnSound:$('btnSound'), btnPause:$('btnPause')
};

/* ================= 配置 ================= */
var CFG = {
  Z0: 30,            // 飞机所在的观察深度
  boundX: 11,        // 活动范围（世界单位）
  boundY: 7,
  planeR: 0.95,      // 飞机碰撞半径
  startSpeed: 25,
  maxSpeed: 74,
  speedUp: 0.30,
  ringR0: 5.1,
  ringR1: 3.25,
  gapT0: 1.38,       // 环间距（秒）
  gapT1: 1.05,
  lives: 3,
  invuln: 1.6,
  leadZ: 118,        // 最远生成距离
  bestKey: 'by15_best'
};

/* ================= 画布尺寸 ================= */
var W=0, H=0, DPR=1, cx=0, cy=0, FOCAL=1, PS=1, isTouch=false;
var skyCv = document.createElement('canvas');
var skyCtx = skyCv.getContext('2d');

function resize(){
  var r = stage.getBoundingClientRect();
  W = Math.max(320, Math.round(r.width));
  H = Math.max(360, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio||1, isTouch ? 1.8 : 2);
  cv.width = Math.round(W*DPR);
  cv.height= Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  cx = W*0.5;
  cy = H*0.5;

  // 缩放：横屏按宽度铺满活动框；竖屏空间紧张，优先保证横向可读，纵向略收
  var portrait = H > W*1.15;
  if(portrait){
    PS = Math.min(W*0.80/CFG.boundX, H*0.40/CFG.boundY);
    cy = H*0.44;
  } else {
    PS = Math.min(W*0.74/CFG.boundX, H*0.60/CFG.boundY);
  }
  FOCAL = PS * CFG.Z0;

  buildSky();
}
function sOf(z){ return FOCAL/Math.max(0.001,z); }
function sx(x,z){ return cx + x*sOf(z); }
function sy(y,z){ return cy - y*sOf(z); }

/* ================= 天空 / 太阳 / 星点（离屏缓存） ================= */
var SKY_PAD = 150;
function buildSky(){
  skyCv.width = Math.round(W*DPR);
  skyCv.height= Math.round((H+SKY_PAD)*DPR);
  var g = skyCtx;
  g.setTransform(DPR,0,0,DPR,0,0);
  var hh = H+SKY_PAD;
  g.clearRect(0,0,W,hh);

  var grd = g.createLinearGradient(0,0,0,hh);
  grd.addColorStop(0.00,'#070a24');
  grd.addColorStop(0.20,'#141a4e');
  grd.addColorStop(0.40,'#3b2a72');
  grd.addColorStop(0.58,'#7b3a80');
  grd.addColorStop(0.72,'#d2603f');
  grd.addColorStop(0.84,'#ff9d52');
  grd.addColorStop(0.93,'#ffc978');
  grd.addColorStop(1.00,'#ffe3ad');
  g.fillStyle = grd;
  g.fillRect(0,0,W,hh);

  // 星点（上半部）
  var n = Math.round(W*H/5200);
  for(var i=0;i<n;i++){
    var x = Math.random()*W;
    var y = Math.pow(Math.random(),1.7)*hh*0.46;
    var a = (1 - y/(hh*0.46))*0.85*Math.random();
    var r = Math.random()*1.15+0.25;
    g.globalAlpha = clamp(a,0,1);
    g.fillStyle = Math.random()<0.18 ? '#ffd9a8' : '#dfe8ff';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.globalAlpha = 1;

  // 星云柔光
  var neb = g.createRadialGradient(W*0.22,hh*0.20,10,W*0.22,hh*0.20,W*0.62);
  neb.addColorStop(0,'rgba(120,90,220,.30)');
  neb.addColorStop(1,'rgba(120,90,220,0)');
  g.fillStyle=neb; g.fillRect(0,0,W,hh*0.6);
  var neb2 = g.createRadialGradient(W*0.86,hh*0.34,10,W*0.86,hh*0.34,W*0.5);
  neb2.addColorStop(0,'rgba(230,90,150,.20)');
  neb2.addColorStop(1,'rgba(230,90,150,0)');
  g.fillStyle=neb2; g.fillRect(0,0,W,hh*0.7);

  // 落日
  var sunX = W*0.735, sunY = hh*0.815, sunR = Math.max(38, Math.min(W,H)*0.085);
  var halo = g.createRadialGradient(sunX,sunY,sunR*0.2,sunX,sunY,sunR*4.6);
  halo.addColorStop(0,'rgba(255,214,150,.55)');
  halo.addColorStop(.34,'rgba(255,150,90,.20)');
  halo.addColorStop(1,'rgba(255,120,70,0)');
  g.fillStyle=halo;
  g.beginPath(); g.arc(sunX,sunY,sunR*4.6,0,TAU); g.fill();
  var core = g.createRadialGradient(sunX-sunR*0.2,sunY-sunR*0.25,1,sunX,sunY,sunR);
  core.addColorStop(0,'#fff6e2');
  core.addColorStop(.55,'#ffd489');
  core.addColorStop(1,'#ff9a52');
  g.fillStyle=core;
  g.beginPath(); g.arc(sunX,sunY,sunR,0,TAU); g.fill();

  // 地平线雾带
  var hz = g.createLinearGradient(0,hh*0.80,0,hh);
  hz.addColorStop(0,'rgba(255,214,160,0)');
  hz.addColorStop(.45,'rgba(255,196,132,.30)');
  hz.addColorStop(1,'rgba(120,80,190,.14)');
  g.fillStyle=hz; g.fillRect(0,hh*0.80,W,hh*0.20);
}

/* ================= 音效（全程序合成） ================= */
var AU = {
  ac:null, master:null, eng:null, on:true, ready:false,
  init:function(){
    if(this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ this.ac = new AC(); }catch(e){ return; }
    this.master = this.ac.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(this.ac.destination);

    var o1=this.ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=62;
    var o2=this.ac.createOscillator(); o2.type='square';   o2.frequency.value=31;
    var f =this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; f.Q.value=5;
    var g =this.ac.createGain(); g.gain.value=0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.eng={o1:o1,o2:o2,f:f,g:g};
    this.ready=true;
  },
  resume:function(){ if(this.ac && this.ac.state==='suspended') this.ac.resume(); },
  engine:function(v, spd){
    if(!this.ready || !this.on) return;
    var t=this.ac.currentTime, e=this.eng;
    e.g.gain.setTargetAtTime(v*0.052, t, 0.14);
    e.o1.frequency.setTargetAtTime(56+spd*1.35, t, 0.18);
    e.o2.frequency.setTargetAtTime(28+spd*0.62, t, 0.18);
    e.f.frequency.setTargetAtTime(280+spd*11, t, 0.25);
  },
  tone:function(freq,dur,type,vol,slideTo,delay){
    if(!this.ready || !this.on) return;
    var t=this.ac.currentTime + (delay||0);
    var o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol==null?0.16:vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.03);
  },
  noise:function(dur,vol,lp){
    if(!this.ready || !this.on) return;
    var t=this.ac.currentTime, sr=this.ac.sampleRate;
    var n=Math.floor(sr*dur);
    var buf=this.ac.createBuffer(1,n,sr), d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
    var s=this.ac.createBufferSource(); s.buffer=buf;
    var f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1400;
    var g=this.ac.createGain(); g.gain.value=vol==null?0.2:vol;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t);
  },
  pass:function(combo){
    var base = 620*Math.pow(1.055, Math.min(combo,14));
    this.tone(base,0.16,'triangle',0.16);
    this.tone(base*1.5,0.22,'sine',0.09,0,0.045);
  },
  perfect:function(){
    this.tone(980,0.13,'triangle',0.15);
    this.tone(1470,0.2,'sine',0.11,0,0.05);
    this.tone(1960,0.26,'sine',0.07,0,0.10);
  },
  orb:function(){ this.tone(1180,0.10,'sine',0.11); this.tone(1760,0.13,'sine',0.06,0,0.04); },
  crash:function(){
    this.noise(0.55,0.26,900);
    this.tone(180,0.5,'sawtooth',0.16,42);
    this.tone(90,0.6,'sine',0.14,36);
  },
  ui:function(){ this.tone(760,0.07,'sine',0.10); }
};
AU.pass2 = function(){ this.tone(520,0.2,'sine',0.09,880); };

/* ================= 输入 ================= */
var IN = { keys:{}, tgt:{x:0,y:0}, ptr:false, px:0, py:0 };
var KEYMAP = {
  'KeyW':'up','ArrowUp':'up','KeyS':'down','ArrowDown':'down',
  'KeyA':'left','ArrowLeft':'left','KeyD':'right','ArrowRight':'right'
};
function keyDir(){
  var d={x:0,y:0};
  if(IN.keys.up)   d.y+=1;
  if(IN.keys.down) d.y-=1;
  if(IN.keys.left) d.x-=1;
  if(IN.keys.right)d.x+=1;
  return d;
}

window.addEventListener('keydown', function(e){
  if(KEYMAP[e.code]){ IN.keys[KEYMAP[e.code]]=true; e.preventDefault(); return; }
  if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); e.preventDefault(); }
  else if(e.code==='KeyR'){ if(G.state!=='menu') startGame(); }
  else if(e.code==='KeyM'){ toggleSound(); }
  else if(e.code==='Space'||e.code==='Enter'){
    if(G.state==='menu'){ startGame(); e.preventDefault(); }
    else if(G.state==='over'){ startGame(); e.preventDefault(); }
    else if(G.state==='paused'){ togglePause(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', function(e){ if(KEYMAP[e.code]) IN.keys[KEYMAP[e.code]]=false; });

function toWorld(cx0, cy0){
  return { x:(cx0-cx)/PS, y:(cy-cy0)/PS };
}
function pointerSet(clientX, clientY){
  var r = cv.getBoundingClientRect();
  var w = toWorld(clientX-r.left, clientY-r.top);
  // 手机端手指会挡住飞机：把目标点往上偏一点
  IN.tgt.x = clamp(w.x, -CFG.boundX, CFG.boundX);
  IN.tgt.y = clamp(w.y + (isTouch?2.0:0), -CFG.boundY, CFG.boundY);
  IN.ptr = true;
}
cv.addEventListener('pointerdown', function(e){
  isTouch = isTouch || (e.pointerType && e.pointerType!=='mouse');
  if(G.state==='menu'||G.state==='over'){ startGame(); e.preventDefault(); return; }
  if(G.state==='paused'){ togglePause(); e.preventDefault(); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  pointerSet(e.clientX,e.clientY);
  e.preventDefault();
});
cv.addEventListener('pointermove', function(e){
  if(e.pointerType && e.pointerType!=='mouse' && !IN.ptr) return;
  if(G.state!=='play') return;
  pointerSet(e.clientX,e.clientY);
});
function endPointer(){ IN.ptr=false; }
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',endPointer);
cv.addEventListener('touchmove',function(e){ e.preventDefault(); }, {passive:false});
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });

/* ================= 世界对象 ================= */
var rings=[], orbs=[], hazards=[], parts=[], clouds=[];
var shake=0, flash=0, hitStop=0;
var G = {
  state:'menu', t:0, score:0, dist:0, lives:CFG.lives,
  speed:CFG.startSpeed, px:0, py:0, vx:0, vy:0,
  combo:0, bestCombo:0, ringN:0, perfectN:0,
  inv:0, roll:0, pitch:0, tail:[], lastZ:0
};

/* 云层 */
function initClouds(){
  clouds.length=0;
  var n = isTouch?11:17;
  for(var i=0;i<n;i++){
    clouds.push({
      x: rnd(-46,46), y: rnd(-4,30), z: rnd(20,150),
      s: rnd(4,11), layer: i%3, a: rnd(0.10,0.26), ph: Math.random()*TAU
    });
  }
}
function updClouds(dt, dz){
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    c.z -= dz*(0.28 + c.layer*0.16);
    if(c.z < 6){ c.z += 150; c.x = rnd(-46,46); c.y = rnd(-4,30); }
  }
}

/* 生成 */
function nextGap(){ return G.speed * lerp(CFG.gapT0, CFG.gapT1, Math.min(1,G.ringN/26)); }

/* 生成游标 cursor：随世界一起前移，保证圆环可以无限续接 */
function portraitLead(){
  // 竖屏可视纵深短，首环放近一点，保证第一眼就能看清目标
  return (H > W*1.15) ? 52 : 68;
}
function leadLimit(){
  return (H > W*1.15) ? 92 : CFG.leadZ;
}
function spawnAhead(){
  var guard=0;
  while(G.lastZ < leadLimit() && guard++<12){
    var gap = nextGap();
    var t = Math.min(1, G.ringN/30);
    var R  = lerp(CFG.ringR0, CFG.ringR1, t) * rnd(0.94,1.08);
    var px0=0, py0=0;
    if(rings.length){
      var lr = rings[rings.length-1];
      px0 = lr.x; py0 = lr.y;
    }
    var reach = Math.min(CFG.boundX*0.72, gap*G.speed*0.42);
    var reachY= Math.min(CFG.boundY*0.68, gap*G.speed*0.36);
    var nx = clamp(px0 + rnd(-reach,reach), -CFG.boundX*0.86, CFG.boundX*0.86);
    var ny = clamp(py0 + rnd(-reachY,reachY), -CFG.boundY*0.84, CFG.boundY*0.84);

    G.lastZ += gap;
    rings.push({
      x:nx, y:ny, z:G.lastZ, R:R,
      k: rnd(0.34,1.0), rot: rnd(0,Math.PI),
      spin: rnd(-0.5,0.5), ph: Math.random()*TAU,
      hue: rnd(0,360), state:0, prev:G.lastZ
    });

    // 环间的能量球
    if(Math.random() < 0.62){
      orbs.push({
        x: nx + rnd(-reach*0.5,reach*0.5),
        y: ny + rnd(-reachY*0.5,reachY*0.5),
        z: G.lastZ - gap*0.5, r:0.85, ph:Math.random()*TAU, got:0
      });
    }
    // 后期加入虚空晶核
    if(G.ringN > 5 && Math.random() < Math.min(0.62, 0.1 + G.ringN*0.018)){
      var a = Math.random()*TAU;
      var rad = R*rnd(1.5,1.95);
      hazards.push({
        x: clamp(nx+Math.cos(a)*rad,-CFG.boundX,CFG.boundX),
        y: clamp(ny+Math.sin(a)*rad,-CFG.boundY,CFG.boundY),
        z: G.lastZ - gap*rnd(0.25,0.7),
        r: 1.15, rot:Math.random()*TAU, spin:rnd(-1.1,1.1), ph:Math.random()*TAU
      });
    }
    G.ringN++;
  }
}

/* ================= 粒子 ================= */
function spark(x,y,z,vx,vy,vz,life,col,size,grav){
  parts.push({k:'s',x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,l:life,L:life,c:col,s:size||0.16,g:grav==null?0:grav});
}
function burst(x,y,z,n,col,spd,size){
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU, e=(Math.random()-0.35)*1.6;
    spark(x,y,z,
      Math.cos(a)*spd*(0.4+Math.random()),
      Math.sin(a)*spd*(0.4+Math.random())+e*spd*0.3,
      -spd*0.15*(0.3+Math.random()),
      0.5+Math.random()*0.55, col, size||0.2);
  }
}
function shock(x,y,z,col,maxR,life){
  parts.push({k:'r',x:x,y:y,z:z,l:life,L:life,c:col,max:maxR||6});
}
function trail(x,y,z){
  parts.push({k:'t',x:x,y:y,z:z,l:0.5,L:0.5,r:0.3+Math.random()*0.3,dr:rnd(-1,1)});
}

/* ================= 更新 ================= */
function startGame(){
  AU.init(); AU.resume(); AU.ui();
  G.state='play'; G.t=0; G.score=0; G.dist=0; G.lives=CFG.lives;
  G.speed=CFG.startSpeed; G.px=0; G.py=0; G.vx=0; G.vy=0;
  G.combo=0; G.bestCombo=0; G.ringN=0; G.perfectN=0; G.inv=0;
  G.roll=0; G.pitch=0; G.lastZ = portraitLead();
  rings.length=0; orbs.length=0; hazards.length=0; parts.length=0; G.tail.length=0;
  IN.tgt.x=0; IN.tgt.y=0; IN.ptr=false;
  shake=0; flash=0; hitStop=0;
  initClouds();
  spawnAhead();
  ui.vStart.hidden=true; ui.vOver.hidden=true; ui.vPause.hidden=true;
  syncHUD();
}

function gameOver(){
  G.state='over';
  AU.engine(0,0); AU.crash();
  var best = readBest();
  var isNew = G.score > best;
  if(isNew) writeBest(G.score);
  ui.fScore.textContent = fmt(G.score);
  ui.fRings.textContent = G.ringN;
  ui.fPerfect.textContent= G.perfectN;
  ui.fCombo.textContent = G.bestCombo;
  ui.fDist.textContent  = fmt(G.dist);
  ui.fBest.textContent  = fmt(Math.max(best,G.score));
  ui.rank.textContent = rankOf(G.score);
  ui.overTitle.textContent = isNew ? '新纪录！' : (G.score>0?'任务结束':'还没出发');
  ui.overSub.textContent = isNew ? '这趟航迹无人超越' : '稳住节奏，再来一次';
  ui.vOver.hidden=false;
  ui.best.textContent = fmt(Math.max(best,G.score));
}
function rankOf(s){
  if(s>=2600) return 'S';
  if(s>=1800) return 'A';
  if(s>=1100) return 'B';
  if(s>=500)  return 'C';
  return 'D';
}
function readBest(){ try{ return parseInt(localStorage.getItem(CFG.bestKey)||'0',10)||0; }catch(e){ return 0; } }
function writeBest(v){ try{ localStorage.setItem(CFG.bestKey, String(v)); }catch(e){} }

function togglePause(){
  if(G.state==='play'){ G.state='paused'; ui.vPause.hidden=false; AU.engine(0,0); }
  else if(G.state==='paused'){ G.state='play'; ui.vPause.hidden=true; AU.resume(); }
}
function toggleSound(){
  AU.on = !AU.on;
  ui.btnSound.textContent = AU.on ? '♪' : '✕';
  ui.btnSound.style.opacity = AU.on ? '1' : '0.5';
  if(AU.on){ AU.init(); AU.resume(); AU.ui(); }
}

function loseLife(x,y,z){
  G.lives--; G.combo=0; G.inv=CFG.invuln;
  shake=16; flash=1; hitStop=0.16;
  burst(x,y,z,30,'#ff9a5c',5.4,0.28);
  burst(x,y,z,18,'#ffe08a',7.2,0.2);
  shock(x,y,z,'rgba(255,140,90,.9)',7,0.5);
  AU.crash();
  syncHUD();
  if(G.lives<=0){ G.lives=0; syncHUD(); gameOver(); }
}

function popUp(text,color){
  ui.pop.textContent = text;
  ui.pop.style.color = color;
  ui.pop.classList.remove('go');
  void ui.pop.offsetWidth;
  ui.pop.classList.add('go');
}

var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  var dtRaw = (ts-last)/1000; last=ts;
  var dt = clamp(dtRaw, 0, 0.05);

  if(hitStop>0){ hitStop-=dt; dt*=0.22; }

  if(G.state==='play') update(dt);
  else { updClouds(0, 0); if(G.state==='menu'||G.state==='over') G.px=Math.sin(ts/1400)*3.4, G.py=Math.sin(ts/2100+1)*1.4; }

  shake *= 0.88;
  flash*= 0.90;
  render();
  syncHudLive();
}

function update(dt){
  G.t += dt;

  // 速度
  G.speed = Math.min(CFG.maxSpeed, G.speed + CFG.speedUp*dt);
  var dz = G.speed*dt;
  G.dist += dz;
  G.lastZ -= dz;

  // 操纵：键盘推动目标点，指针直接设定目标点
  var kd = keyDir();
  if(kd.x||kd.y){
    var l = Math.hypot(kd.x,kd.y);
    var steer = 12.5;
    IN.tgt.x = clamp(IN.tgt.x + kd.x/l*steer*dt, -CFG.boundX, CFG.boundX);
    IN.tgt.y = clamp(IN.tgt.y + kd.y/l*steer*dt, -CFG.boundY, CFG.boundY);
  }
  // 弹簧跟随
  var k = IN.ptr ? 15 : 11;
  var ax = (IN.tgt.x-G.px)*k*k, ay = (IN.tgt.y-G.py)*k*k;
  G.vx += (ax - G.vx*2*Math.sqrt(k))*dt;
  G.vy += (ay - G.vy*2*Math.sqrt(k))*dt;
  var vmax = IN.ptr?46:34;
  var vm = Math.hypot(G.vx,G.vy);
  if(vm>vmax){ G.vx=G.vx/vm*vmax; G.vy=G.vy/vm*vmax; }
  G.px += G.vx*dt; G.py += G.vy*dt;

  // 越界保护（软墙）
  if(G.px<-CFG.boundX){ G.px=-CFG.boundX; G.vx*=-0.25; }
  if(G.px> CFG.boundX){ G.px= CFG.boundX; G.vx*=-0.25; }
  if(G.py<-CFG.boundY){ G.py=-CFG.boundY; G.vy*=-0.25; }
  if(G.py> CFG.boundY){ G.py= CFG.boundY; G.vy*=-0.25; }

  G.roll  = lerp(G.roll, clamp(-G.vx/26,-1,1), 1-Math.pow(0.001,dt));
  G.pitch = lerp(G.pitch, clamp( G.vy/30,-1,1), 1-Math.pow(0.001,dt));

  if(G.inv>0) G.inv-=dt;

  // 世界推进
  for(var i=rings.length-1;i>=0;i--){
    var r=rings[i]; r.prev=r.z; r.z-=dz; r.rot+=r.spin*dt*0.5; r.ph+=dt;
    // 穿环判定
    if(r.state===0 && r.prev>CFG.Z0 && r.z<=CFG.Z0){
      var dx=G.px-r.x, dy=G.py-r.y, d=Math.hypot(dx,dy);
      if(d < r.R-CFG.planeR*0.55){
        var perfect = d < r.R*0.42;
        G.combo++; if(G.combo>G.bestCombo) G.bestCombo=G.combo;
        var gain = 10 + Math.min(G.combo,20)*2 + (perfect?40:0);
        G.score += gain;
        r.state=1;
        burst(r.x,r.y,r.z, perfect?26:16, perfect?'#fff0b8':'#9ff0ff', 3.6, 0.2);
        shock(r.x,r.y,r.z, perfect?'rgba(255,220,140,.95)':'rgba(150,240,255,.9)', r.R*2.1, 0.45);
        if(perfect){ G.perfectN++; popUp('完美穿环 +'+(gain), '#ffd98a'); AU.perfect(); }
        else { popUp('+'+gain, '#9ff0ff'); AU.pass(G.combo); }
        if(G.combo>=3){
          ui.combo.textContent='连击 ×'+G.combo;
          ui.combo.classList.add('on');
        }
      } else if(d <= r.R+0.5){
        r.state=2;
        if(G.inv<=0) loseLife(G.px,G.py,CFG.Z0);
      } else {
        r.state=3;
        if(G.combo>0) popUp('漏环','#ff9db0');
        G.combo=0; ui.combo.classList.remove('on');
      }
    }
    if(r.z < -14) rings.splice(i,1);
  }
  spawnAhead();

  for(var j=orbs.length-1;j>=0;j--){
    var o=orbs[j]; o.z-=dz; o.ph+=dt*3;
    if(o.got===0 && Math.abs(o.z-CFG.Z0)<3.2){
      var ddx=G.px-o.x, ddy=G.py-o.y;
      if(ddx*ddx+ddy*ddy < (o.r+CFG.planeR*1.1)*(o.r+CFG.planeR*1.1)){
        o.got=1; G.score+=25; burst(o.x,o.y,o.z,12,'#b9ffe6',2.6,0.16); AU.orb();
      }
    }
    if(o.z<-10) orbs.splice(j,1);
  }

  for(var h=hazards.length-1;h>=0;h--){
    var z2=hazards[h]; z2.z-=dz; z2.rot+=z2.spin*dt; z2.ph+=dt;
    if(Math.abs(z2.z-CFG.Z0)<2.6){
      var hx=G.px-z2.x, hy=G.py-z2.y;
      if(hx*hx+hy*hy < (z2.r+CFG.planeR)*(z2.r+CFG.planeR)){
        z2.z = CFG.Z0-40;
        if(G.inv<=0) loseLife(G.px,G.py,CFG.Z0);
      }
    }
    if(z2.z<-10) hazards.splice(h,1);
  }

  // 尾迹
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];
    q.l-=dt;
    if(q.k==='s'){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; q.vy-=q.g*dt; }
    else if(q.k==='t'){ q.z-=dz*0.42; q.r+=q.dr*dt*1.7; if(q.r<0.02) q.l=0; }
    if(q.l<=0) parts.splice(p,1);
  }
  if(Math.random()<0.34){
    var bx = G.px - Math.sin(G.roll)*1.0;
    var by = G.py - Math.cos(G.roll)*0.9;
    trail(bx, by, CFG.Z0-1.6);
  }
  if(Math.random()<0.14) trail(G.px+rnd(-1.6,1.6), G.py+rnd(-1.4,1.4), CFG.Z0-1.9);

  updClouds(dt, dz);
  AU.engine(1, G.speed);
}

function syncHUD(){
  ui.best.textContent = fmt(readBest());
  var hs = ui.hearts.children;
  for(var i=0;i<3;i++) hs[i].className = (i<G.lives?'':'off');
}
function syncHudLive(){
  ui.score.textContent = fmt(G.score);
}

/* ================= 渲染 ================= */
function render(){
  var shx=0, shy=0;
  if(shake>0.3){ shx=(Math.random()-0.5)*shake; shy=(Math.random()-0.5)*shake; }
  ctx.save();
  ctx.translate(shx,shy);

  // 天空（带轻微视差）
  var par = clamp(-G.py*7, -60, 60);
  ctx.drawImage(skyCv, 0, -SKY_PAD*0.42+par, W, H+SKY_PAD);

  drawGrid();
  drawClouds();
  drawWorld();
  drawPlane();
  drawParticles();
  drawSpeedLines();
  ctx.restore();

  // 暗角 + 撞击闪光
  if(!vigCv || vigCv.width!==cv.width){
    vigCv = document.createElement('canvas');
    vigCv.width=cv.width; vigCv.height=cv.height;
    var vg=vigCv.getContext('2d');
    vg.setTransform(DPR,0,0,DPR,0,0);
    var v=vg.createRadialGradient(W/2,H/2,Math.min(W,H)*0.30,W/2,H/2,Math.max(W,H)*0.78);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba(4,6,20,.55)');
    vg.fillStyle=v; vg.fillRect(0,0,W,H);
  }
  ctx.drawImage(vigCv,0,0,W,H);

  if(flash>0.01){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,190,150,'+(flash*0.30).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
}
var vigCv=null;

/* 网格海面 */
function drawGrid(){
  var GY = -CFG.boundY - 0.6;
  var far = 300;

  // 横向线（恒定 z）
  var step = 3.5;
  for(var z=CFG.Z0; z<far; z+=step){
    step = lerp(3.5,30,(z-CFG.Z0)/(far-CFG.Z0));
    var s = sOf(z), y = cy + (0-GY)*s;
    if(y < -20 || y > H+20) continue;
    var t=(z-CFG.Z0)/(far-CFG.Z0);
    var a = clamp(1-t,0,1);
    ctx.strokeStyle='rgba(160,215,255,'+(a*0.30).toFixed(3)+')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    // 亮线强调
    if(Math.round(z/step)%4===0){
      ctx.strokeStyle='rgba(190,235,255,'+(a*0.30).toFixed(3)+')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
  }
  // 纵向线（恒定 x）
  for(var x=-CFG.boundX*2.2; x<=CFG.boundX*2.2; x+=2.4){
    var proj = projectLine(x, GY, far);
    if(!proj) continue;
    var av = 0.9*proj.a;
    ctx.strokeStyle='rgba(196,150,255,'+(av*0.34).toFixed(3)+')';
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(proj.x0,proj.y0);
    ctx.lineTo(proj.x1,proj.y1); ctx.stroke();
  }
  // 海面辉光
  var gs = sOf(CFG.Z0);
  var gy = cy + (0-GY)*gs;
  var gr = ctx.createLinearGradient(0,gy,0,gy+110);
  gr.addColorStop(0,'rgba(130,95,235,.34)');
  gr.addColorStop(1,'rgba(130,95,235,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,gy,W,110);
  // 网格地平线亮线
  ctx.strokeStyle='rgba(190,220,255,.34)';
  ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
}
function projectLine(x, y, far){
  var z0=CFG.Z0, z1=far;
  var s0=sOf(z0), s1=sOf(z1);
  var x0=cx+x*s0, y0=cy-(y)*s0;
  var x1=cx+x*s1, y1=cy-(y)*s1;
  if(y0<H+40 && y1<H+40 && y0>-40){
    return {x0:x0,y0:y0,x1:x1,y1:y1,a:0.9};
  }
  return null;
}

/* 云 */
function drawClouds(){
  var list = clouds.slice().sort(function(a,b){ return b.z-a.z; });
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var s=sOf(c.z), r=c.s*s;
    if(r<1.5 || r>W*2.2) continue;
    var x=cx+c.x*s, y=cy-c.y*s;
    if(x<-r*2 || x>W+r*2 || y<-r || y>H+r) continue;
    var near = clamp(1-(c.z-CFG.Z0)/150,0,1);
    var a = c.a*(0.35+near*0.85);
    var warm = clamp(1-c.y/30,0,1);
    var col = 'rgba('+Math.round(210+warm*45)+','+Math.round(150+warm*50)+','+Math.round(215-warm*70)+',';
    ctx.globalCompositeOperation='lighter';
    var puffs=4;
    for(var p=0;p<puffs;p++){
      var ang=(c.ph+p*1.7);
      var ox=Math.cos(ang)*r*0.42, oy=Math.sin(ang*0.8)*r*0.13;
      var rr=r*(0.62+0.24*Math.sin(p*2.1+c.ph));
      var g=ctx.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rr);
      g.addColorStop(0, col+(a*0.85).toFixed(3)+')');
      g.addColorStop(0.55,col+(a*0.30).toFixed(3)+')');
      g.addColorStop(1,col+'0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.ellipse(x+ox,y+oy,rr,rr*0.44,0,0,TAU); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
}

/* 世界对象按深度排序 */
function drawWorld(){
  var list=[];
  for(var i=0;i<rings.length;i++){
    var r=rings[i];
    if(r.z<2||r.z>230) continue;
    list.push({z:r.z, t:'r', o:r});
  }
  for(var j=0;j<hazards.length;j++){
    var z=hazards[j];
    if(z.z<2||z.z>230) continue;
    list.push({z:z.z, t:'h', o:z});
  }
  for(var k=0;k<orbs.length;k++){
    var o=orbs[k];
    if(o.got || o.z<2||o.z>230) continue;
    list.push({z:o.z, t:'o', o:o});
  }
  list.sort(function(a,b){ return b.z-a.z; });
  for(var m=0;m<list.length;m++){
    if(list[m].t==='r') drawRing(list[m].o);
    else if(list[m].t==='h') drawHazard(list[m].o);
    else drawOrb(list[m].o);
  }
}

function ringColor(state, next){
  if(state===1) return ['#8affc8','#2fd48a'];
  if(state===3) return ['#5d6a94','#39415f'];
  if(next)  return ['#ffe9b0','#ff9d3d'];
  return ['#bfe6ff','#3f8fd8'];
}

function drawRing(r){
  var s=sOf(r.z);
  var R=r.R*s;
  if(R<2) return;
  var x=cx+r.x*s, y=cy-r.y*s;
  if(x<-R*2.4||x>W+R*2.4) return;
  var next = findNextZ();
  var isNext = Math.abs(r.z-next) < 0.01;
  var col = ringColor(r.state, isNext);
  var k = r.k, rot = r.rot + (isNext? Math.sin(G.t*1.6)*0.06:0);
  var fade = clamp(1-(r.z-CFG.Z0)/240,0,1);
  var A = (r.state===3?0.16:1)*fade;
  if(r.state===2) A*=0.2;

  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);

  function ringPath(rad){
    ctx.beginPath();
    for(var i=0;i<=44;i++){
      var t=i/44*TAU;
      var px=Math.cos(t)*rad, py=Math.sin(t)*rad*k;
      if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py);
    }
    ctx.closePath();
  }

  // 外辉光
  ctx.globalCompositeOperation='lighter';
  ctx.shadowColor = col[1]; ctx.shadowBlur = Math.min(38, R*0.55);
  ringPath(R);
  ctx.strokeStyle = hexA(col[1], 0.16*A);
  ctx.lineWidth = Math.max(3, R*0.30);
  ctx.stroke();
  ctx.shadowBlur = Math.min(20, R*0.30);

  // 主环
  ringPath(R);
  var lg = ctx.createLinearGradient(-R,0,R,0);
  lg.addColorStop(0, hexA(col[0],0.95*A));
  lg.addColorStop(0.5,hexA(col[1],0.98*A));
  lg.addColorStop(1, hexA(col[0],0.95*A));
  ctx.strokeStyle=lg;
  ctx.lineWidth = Math.max(1.6, R*0.11);
  ctx.stroke();
  ctx.shadowBlur=0;

  // 内高光
  ringPath(R*0.93);
  ctx.strokeStyle = 'rgba(255,255,255,'+(0.42*A).toFixed(3)+')';
  ctx.lineWidth = Math.max(0.7, R*0.030);
  ctx.stroke();

  // 旋转虚线内环
  ctx.save();
  ctx.rotate(r.ph*0.8);
  ctx.setLineDash([Math.max(2,R*0.16), Math.max(3,R*0.20)]);
  ringPath(R*0.70);
  ctx.strokeStyle = hexA(col[0], 0.5*A);
  ctx.lineWidth = Math.max(0.8, R*0.035);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 外沿刻度
  var ticks = 12;
  for(var i=0;i<ticks;i++){
    var t = i/ticks*TAU + r.ph*0.35;
    var ca=Math.cos(t), sa=Math.sin(t)*k;
    var ix=ca*R*1.02, iy=sa*R*1.02;
    var ox=ca*R*(1.0 + 0.10 + 0.04*Math.sin(r.ph*2+i)), oy=sa*R*(1.0+0.10);
    ctx.strokeStyle = hexA(col[0], 0.75*A);
    ctx.lineWidth = Math.max(0.8, R*0.035);
    ctx.beginPath(); ctx.moveTo(ix,iy); ctx.lineTo(ox,oy); ctx.stroke();
  }

  // 下一个目标：呼吸光环 + 箭头
  if(isNext && r.state===0){
    var pulse = 1 + 0.05*Math.sin(G.t*5.2);
    ringPath(R*1.20*pulse);
    ctx.strokeStyle='rgba(255,255,255,'+(0.30*(1-pulse+0.9)).toFixed(3)+')';
    ctx.lineWidth=Math.max(1,R*0.05);
    ctx.stroke();
    for(var a2=0;a2<3;a2++){
      var ang = G.t*1.9 + a2*TAU/3;
      var arx=Math.cos(ang)*R*1.42, ary=Math.sin(ang)*R*1.42*k;
      ctx.save(); ctx.translate(arx,ary); ctx.rotate(ang);
      ctx.fillStyle='rgba(255,214,140,'+(0.55+0.35*Math.sin(G.t*5)).toFixed(3)+')';
      ctx.beginPath();
      ctx.moveTo(R*0.10,0); ctx.lineTo(-R*0.06,-R*0.09); ctx.lineTo(-R*0.06,R*0.09);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}
function findNextZ(){
  var m=1e9;
  for(var i=0;i<rings.length;i++){ if(rings[i].state===0){ m=Math.min(m,rings[i].z); } }
  return m;
}

function drawHazard(h){
  var s=sOf(h.z), R=h.r*s;
  if(R<1.5) return;
  var x=cx+h.x*s, y=cy-h.y*s;
  if(x<-R*3||x>W+R*3) return;
  var fade=clamp(1-(h.z-CFG.Z0)/240,0,1);
  var pulse = 0.72+0.28*Math.sin(h.ph*4);
  var n=6;
  ctx.save(); ctx.translate(x,y); ctx.rotate(h.rot);
  ctx.globalCompositeOperation='lighter';
  // 危险外环
  ctx.beginPath(); ctx.arc(0,0,R*1.65,0,TAU);
  ctx.strokeStyle='rgba(255,90,110,'+(0.30*pulse*fade).toFixed(3)+')';
  ctx.setLineDash([R*0.30,R*0.22]); ctx.lineWidth=Math.max(1,R*0.10);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.shadowColor='rgba(255,70,90,.9)'; ctx.shadowBlur=R*0.7;
  // 晶体
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var t=i/n*TAU, rr=R*(i%2?0.66:1.0);
    var px=Math.cos(t)*rr, py=Math.sin(t)*rr;
    if(i) ctx.lineTo(px,py); else ctx.moveTo(px,py);
  }
  ctx.closePath();
  var g=ctx.createLinearGradient(-R,-R,R,R);
  g.addColorStop(0,'rgba(255,214,120,'+(0.95*fade)+')');
  g.addColorStop(.5,'rgba(255,86,110,'+(0.95*fade)+')');
  g.addColorStop(1,'rgba(160,40,190,'+(0.95*fade)+')');
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,236,200,'+(0.8*fade)+')';
  ctx.lineWidth=Math.max(0.7,R*0.07); ctx.stroke();
  // 内核
  ctx.beginPath(); ctx.arc(0,0,R*0.24,0,TAU);
  ctx.fillStyle='rgba(255,255,240,'+(0.9*fade)+')'; ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
}

function drawOrb(o){
  var s=sOf(o.z), R=o.r*s;
  if(R<1.2) return;
  var x=cx+o.x*s, y=cy-o.y*s;
  if(x<-R*4||x>W+R*4) return;
  var fade=clamp(1-(o.z-CFG.Z0)/240,0,1);
  ctx.save(); ctx.translate(x,y);
  ctx.globalCompositeOperation='lighter';
  ctx.shadowColor='rgba(120,255,210,.9)'; ctx.shadowBlur=R*1.3;
  ctx.rotate(o.ph*0.5);
  ctx.beginPath();
  ctx.moveTo(0,-R); ctx.lineTo(R*0.72,0); ctx.lineTo(0,R); ctx.lineTo(-R*0.72,0);
  ctx.closePath();
  var g=ctx.createLinearGradient(-R,0,R,0);
  g.addColorStop(0,'rgba(190,255,236,'+(0.95*fade)+')');
  g.addColorStop(1,'rgba(70,210,200,'+(0.95*fade)+')');
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  ctx.rotate(-o.ph*1.1);
  ctx.beginPath(); ctx.arc(0,0,R*1.7,0,TAU);
  ctx.strokeStyle='rgba(140,255,225,'+(0.28*fade)+')';
  ctx.lineWidth=Math.max(0.7,R*0.10); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
}

/* 粒子 */
function drawParticles(){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var s=sOf(p.z), k=p.l/p.L;
    var x=cx+p.x*s, y=cy-p.y*s;
    if(p.k==='s'){
      var r=Math.max(0.6,p.s*s);
      ctx.globalAlpha=clamp(k,0,1);
      ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    } else if(p.k==='t'){
      var rr=Math.max(0.5,p.r*s*0.5);
      ctx.globalAlpha=clamp(k,0,1)*0.42;
      var g=ctx.createRadialGradient(x,y,0,x,y,rr*3);
      g.addColorStop(0,'rgba(255,214,170,.9)');
      g.addColorStop(0.4,'rgba(255,140,110,.4)');
      g.addColorStop(1,'rgba(255,120,100,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,y,rr*3,0,TAU); ctx.fill();
    } else if(p.k==='r'){
      var e=1-k;
      ctx.globalAlpha=clamp(k,0,1)*0.9;
      ctx.strokeStyle=p.c;
      ctx.lineWidth=Math.max(1,5*k);
      ctx.beginPath();
      ctx.ellipse(x,y, Math.max(1,p.max*e*s), Math.max(1,p.max*e*s*0.72), 0,0,TAU);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

/* 飞机 */
function drawPlane(){
  var s=PS*0.92;
  var x=cx+G.px*PS, y=cy-G.py*PS;
  var blink = G.inv>0 && ((G.t*12)|0)%2===0;
  var alpha = blink?0.30:1;

  ctx.save();
  ctx.translate(x,y);

  // 引擎尾焰
  var th = 0.72 + G.speed/CFG.maxSpeed*0.72;
  ctx.globalCompositeOperation='lighter';
  var fg=ctx.createLinearGradient(0,0,0,s*2.0*th);
  fg.addColorStop(0,'rgba(255,246,214,'+(0.72*alpha)+')');
  fg.addColorStop(.3,'rgba(255,168,90,'+(0.42*alpha)+')');
  fg.addColorStop(.72,'rgba(255,90,120,'+(0.14*alpha)+')');
  fg.addColorStop(1,'rgba(180,60,200,0)');
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(-s*0.17, s*0.55);
  ctx.quadraticCurveTo(-s*0.26, s*1.15*th, 0, s*1.95*th);
  ctx.quadraticCurveTo(s*0.26, s*1.15*th, s*0.17, s*0.55);
  ctx.closePath(); ctx.fill();
  // 焰心
  ctx.beginPath();
  ctx.moveTo(-s*0.09, s*0.58);
  ctx.quadraticCurveTo(-s*0.12, s*0.95, 0, s*1.25*th);
  ctx.quadraticCurveTo(s*0.12, s*0.95, s*0.09, s*0.58);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,248,'+(0.8*alpha)+')';
  ctx.fill();
  ctx.globalCompositeOperation='source-over';

  ctx.rotate(G.roll*0.42);
  ctx.scale(1, 1-Math.abs(G.pitch)*0.10);

  // 机翼阴影层
  ctx.fillStyle='rgba(10,14,40,.5)';
  wingPath(ctx,s,2); ctx.fill();

  // 主机翼
  var wg=ctx.createLinearGradient(-s*1.7,0,s*1.7,0);
  wg.addColorStop(0,'#cfd8ee');
  wg.addColorStop(.5,'#f4f7ff');
  wg.addColorStop(1,'#cfd8ee');
  ctx.fillStyle=wg;
  wingPath(ctx,s,0); ctx.fill();
  ctx.strokeStyle='rgba(70,90,150,.5)'; ctx.lineWidth=Math.max(0.6,s*0.035);
  wingPath(ctx,s,0); ctx.stroke();

  // 翼端灯
  ctx.globalCompositeOperation='lighter';
  navLight(ctx,-s*1.62,-s*0.12,s*0.22,'255,90,120');
  navLight(ctx, s*1.62,-s*0.12,s*0.22,'90,255,160');
  ctx.globalCompositeOperation='source-over';

  // 尾翼
  ctx.fillStyle='#dbe3f6';
  ctx.beginPath();
  ctx.moveTo(-s*0.62,-s*0.42); ctx.lineTo(-s*0.30,-s*1.16);
  ctx.lineTo(s*0.30,-s*1.16);  ctx.lineTo(s*0.62,-s*0.42);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(70,90,150,.42)'; ctx.lineWidth=Math.max(0.6,s*0.03); ctx.stroke();

  // 垂尾
  ctx.fillStyle='#eef2ff';
  ctx.beginPath();
  ctx.moveTo(-s*0.10,-s*0.5); ctx.lineTo(-s*0.08,-s*1.52);
  ctx.lineTo(s*0.08,-s*1.52);  ctx.lineTo(s*0.10,-s*0.5);
  ctx.closePath(); ctx.fill();

  // 机身
  var bg=ctx.createLinearGradient(-s*0.5,0,s*0.5,0);
  bg.addColorStop(0,'#aab6d4');
  bg.addColorStop(.42,'#ffffff');
  bg.addColorStop(1,'#9fabc9');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(0,-s*1.30);
  ctx.quadraticCurveTo(s*0.34,-s*0.55, s*0.30, s*0.18);
  ctx.quadraticCurveTo(s*0.26, s*0.70, 0, s*0.76);
  ctx.quadraticCurveTo(-s*0.26,s*0.70, -s*0.30,s*0.18);
  ctx.quadraticCurveTo(-s*0.34,-s*0.55, 0,-s*1.30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(60,80,140,.42)'; ctx.lineWidth=Math.max(0.6,s*0.032); ctx.stroke();

  // 红条涂装
  ctx.fillStyle='rgba(255,90,120,.85)';
  ctx.fillRect(-s*0.26,-s*0.30,s*0.52,s*0.13);
  ctx.fillStyle='rgba(90,190,255,.75)';
  ctx.fillRect(-s*0.26,-s*0.10,s*0.52,s*0.07);

  // 座舱
  var cg=ctx.createLinearGradient(0,-s*1.10,0,-s*0.42);
  cg.addColorStop(0,'#8fe3ff');
  cg.addColorStop(.5,'#2b4f8f');
  cg.addColorStop(1,'#16224a');
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.moveTo(0,-s*1.16);
  ctx.quadraticCurveTo(s*0.22,-s*0.80, s*0.18,-s*0.48);
  ctx.quadraticCurveTo(0,-s*0.38, -s*0.18,-s*0.48);
  ctx.quadraticCurveTo(-s*0.22,-s*0.80, 0,-s*1.16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-s*0.06,-s*0.86,s*0.07,s*0.16,-0.4,0,TAU); ctx.fill();

  // 双发动机喷口
  ctx.globalCompositeOperation='lighter';
  var ey = s*0.76;
  for(var i=0;i<2;i++){
    var ex = (i?-1:1)*s*0.155;
    var g2=ctx.createRadialGradient(ex,ey,0,ex,ey,s*0.20);
    g2.addColorStop(0,'rgba(255,255,240,'+(0.95*alpha)+')');
    g2.addColorStop(.45,'rgba(255,180,110,'+(0.6*alpha)+')');
    g2.addColorStop(1,'rgba(255,120,90,0)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(ex,ey,s*0.20,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  ctx.restore();
  ctx.globalAlpha=1;

  // 无敌护盾
  if(G.inv>0){
    var p=1-G.inv/CFG.invuln;
    ctx.save();
    ctx.translate(x,y);
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(150,220,255,'+(0.55*(1-p)+0.20).toFixed(3)+')';
    ctx.lineWidth=Math.max(1.2,s*0.10);
    ctx.beginPath(); ctx.ellipse(0,0,s*1.35,s*1.35,0,0,TAU); ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }
}
function wingPath(c,s,dy){
  c.beginPath();
  c.moveTo(-s*0.26, s*0.10+dy);
  c.lineTo(-s*1.66,-s*0.24+dy);
  c.lineTo(-s*1.58,-s*0.02+dy);
  c.lineTo(-s*0.22, s*0.40+dy);
  c.lineTo(s*0.22, s*0.40+dy);
  c.lineTo(s*1.58,-s*0.02+dy);
  c.lineTo(s*1.66,-s*0.24+dy);
  c.lineTo(s*0.26, s*0.10+dy);
  c.closePath();
}
function navLight(c,x,y,r,rgb){
  var g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+rgb+',1)');
  g.addColorStop(.4,'rgba('+rgb+',.45)');
  g.addColorStop(1,'rgba('+rgb+',0)');
  c.fillStyle=g;
  c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
}
function hexA(hex,a){
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+clamp(a,0,1).toFixed(3)+')';
}

/* 速度线 */
function drawSpeedLines(){
  var t = clamp((G.speed-CFG.startSpeed)/(CFG.maxSpeed-CFG.startSpeed),0,1);
  if(t<0.18 || G.state!=='play') return;
  var n = Math.round(t*26);
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<n;i++){
    var a = (i/n)*TAU + G.t*0.6;
    var r0 = Math.min(W,H)*(0.30+((i*37)%17)/17*0.34);
    var r1 = r0 + Math.min(W,H)*(0.06+t*0.16);
    ctx.strokeStyle='rgba(255,236,214,'+(0.05+t*0.11).toFixed(3)+')';
    ctx.lineWidth = 1.2 + t*1.6;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0*0.86);
    ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1*0.86);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}

requestAnimationFrame(frame);
